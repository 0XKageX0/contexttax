<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<script>
(function () {
  try {
    var t = localStorage.getItem("contexttax-theme");
    if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    document.querySelector('meta[name="color-scheme"]').content = t;
  } catch (e) {}
})();
</script>
<title>contexttax</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312151c'/%3E%3Crect x='6' y='14' width='20' height='8' fill='%23ffe14a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="light"] {
    --ink: #12151c;
    --paper: #f3f5f8;
    --card: #ffffff;
    --mute: #5c6472;
    --yellow: #ffe14a;
    --blue: #d7e4ff;
    --on-ink: #f4f6fb;
    --hair: #c5cad3;
    --track: #e6e9ef;
    --sans: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --ink: #f2efe4;
    --paper: #14161c;
    --card: #1c1f27;
    --mute: #a8aebb;
    --yellow: #ffe14a;
    --blue: #243049;
    --on-ink: #14161c;
    --hair: #3c4352;
    --track: #2a2e38;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
  }
  ::selection { background: var(--yellow); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topline {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 20;
    width: 30%;
    height: 3px;
    background: var(--ink);
    transform: translateX(-120%);
    pointer-events: none;
  }
  body.scanning .topline { animation: walk 0.85s linear infinite; }
  .wrap { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
  }
  .word {
    margin: 0;
    font-weight: 600;
    letter-spacing: -0.03em;
    font-size: 15px;
  }
  .nav-meta { margin: 2px 0 0; color: var(--mute); font-family: var(--mono); font-size: 11px; }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(240px, 0.8fr);
    gap: 28px;
    align-items: end;
    padding: 36px 0 28px;
    border-bottom: 2px solid var(--ink);
  }
  h1 {
    margin: 8px 0 12px;
    font-weight: 500;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    letter-spacing: -0.045em;
    line-height: 0.92;
  }
  h1 span:nth-child(2) { position: relative; }
  h1 span:nth-child(2)::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0.08em;
    width: 7.15ch;
    height: 0.14em;
    background: var(--yellow);
    transform: scaleX(0);
    transform-origin: left center;
    z-index: -1;
  }
  h1 span { display: block; overflow: hidden; }
  h1 i { display: block; font-style: normal; position: relative; z-index: 1; }
  h1 span:nth-child(2)::after { z-index: 0; }
  .kicker {
    margin: 0;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .lede { margin: 0; max-width: 38rem; color: var(--mute); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn {
    min-height: 44px;
    padding: 0 14px;
    border: 2px solid var(--ink);
    border-radius: 2px;
    background: var(--card);
    box-shadow: 4px 4px 0 var(--ink);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .btn.ink { background: var(--ink); color: var(--on-ink); }
  .btn.yellow, .slab, .tok.hot, .facts dd.warn { color: #12151c; }
  .nav-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .theme {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-width: 132px;
    min-height: 44px;
    padding: 0;
    border: 2px solid var(--ink);
    background: var(--card);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .theme i {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc(50% - 4px);
    background: var(--yellow);
    transition: transform 0.32s cubic-bezier(.2,.7,.2,1);
  }
  [data-theme="dark"] .theme i { transform: translateX(calc(100% + 2px)); }
  .theme span { position: relative; z-index: 1; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  [data-theme="dark"] .theme span:last-child { color: #12151c; }
  .theme:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .btn.yellow { background: var(--yellow); }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: 0.55; cursor: wait; }
  .btn.small { min-height: 40px; padding: 0 12px; box-shadow: 3px 3px 0 var(--ink); font-size: 13px; }
  .btn.small:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .slab {
    background: var(--yellow);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding: 16px 16px 14px;
    transform-origin: left center;
  }
  .slab strong {
    display: block;
    margin-top: 6px;
    font-family: var(--mono);
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    letter-spacing: -0.05em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .fine { margin: 10px 0 0; font-family: var(--mono); font-size: 12px; }
  .facts {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin: 0;
    border-bottom: 2px solid var(--ink);
  }
  .facts div { padding: 14px 12px 14px 0; border-right: 2px solid var(--ink); }
  .facts div:last-child { border-right: 0; }
  .facts dt {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .facts dd {
    margin: 4px 0 0;
    font-family: var(--mono);
    font-size: 1.35rem;
    letter-spacing: -0.04em;
  }
  .facts dd.warn { background: var(--yellow); display: inline-block; padding: 0 4px; }
  .pathline {
    margin: 0;
    padding: 10px 0;
    border-bottom: 2px solid var(--ink);
    color: var(--mute);
    font-family: var(--mono);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .split { display: grid; gap: 36px; margin-top: 28px; }
  h2 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    font-weight: 500;
    letter-spacing: -0.03em;
  }
  .hint { margin: 0 0 12px; color: var(--mute); font-size: 13px; }
  .group-label {
    margin: 18px 0 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .row {
    padding: 14px 0;
    border-bottom: 2px solid var(--ink);
  }
  .row.picked { background: var(--blue); margin: 0 -8px; padding-left: 8px; padding-right: 8px; }
  .pick {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: start;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 0;
  }
  .idx { font-family: var(--mono); font-size: 12px; color: var(--mute); padding-top: 4px; }
  .agent-name { font-weight: 600; letter-spacing: -0.02em; }
  .tok { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tok.hot { background: var(--yellow); padding: 0 4px; }
  .meta { color: var(--mute); font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .files { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .file-card { border-top: 1px solid var(--hair); padding-top: 8px; position: relative; }
  .purpose { margin: 4px 0 0; }
  .when { margin: 2px 0 0; color: var(--mute); font-family: var(--mono); font-size: 12px; }
  code { font-family: var(--mono); font-size: 0.92em; overflow-wrap: anywhere; }
  .bar { height: 8px; margin-top: 8px; background: var(--track); border: 2px solid var(--ink); }
  .bar i { display: block; height: 100%; background: var(--ink); transform-origin: left center; }
  .bar.hot i { background: var(--ink); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px 0; position: relative; margin: 0 0 8px; border-bottom: 2px solid var(--ink); }
  .tab {
    position: relative;
    z-index: 1;
    min-height: 44px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--mute);
    font-weight: 600;
  }
  .tab[aria-pressed="true"] { color: var(--ink); }
  .rule {
    position: absolute;
    left: 0;
    bottom: -2px;
    height: 3px;
    background: var(--ink);
    width: 0;
    pointer-events: none;
  }
  .finding {
    padding: 12px 0;
    border-bottom: 1px solid var(--hair);
  }
  .finding-top { display: flex; justify-content: space-between; gap: 10px; }
  .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .quote { margin: 6px 0; overflow-wrap: anywhere; }
  .where { margin: 0; color: var(--mute); font-size: 13px; overflow-wrap: anywhere; }
  .locs { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .loc { background: var(--blue); padding: 4px 8px; font-family: var(--mono); font-size: 12px; }
  .more, .pager {
    min-height: 44px;
    margin-top: 8px;
    padding: 0 12px;
    border: 2px solid var(--ink);
    background: var(--card);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .more:active, .pager:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .empty, .error, .loading { padding: 16px 0; color: var(--mute); }
  .error { color: #12151c; background: var(--yellow); padding: 12px; border: 2px solid var(--ink); }
  footer.colophon { margin-top: 28px; color: var(--mute); font-family: var(--mono); font-size: 12px; }
  .row { position: relative; }
  .row.picked::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 4px;
    background: var(--ink);
    transform-origin: top center;
    animation: growY 0.28s cubic-bezier(.2,.7,.2,1) both;
  }
  .wipe {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--yellow);
    pointer-events: none;
    transform: scaleX(0);
    transform-origin: right center;
  }
  .wipe.go { animation: wipe 0.72s cubic-bezier(.65,0,.35,1) forwards; }
  .striking::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 55%;
    height: 2px;
    background: var(--ink);
    transform: scaleX(0);
    transform-origin: left center;
    animation: strike 0.32s linear forwards;
  }
  .restoring { animation: lift 0.32s ease forwards; }
  .enter h1 i { animation: maskin 0.55s cubic-bezier(.2,.7,.2,1) both; }
  .enter h1 span:nth-child(2) i { animation-delay: 0.08s; }
  .enter h1 span:nth-child(2)::after { animation: grow 0.4s cubic-bezier(.2,.7,.2,1) 0.42s both; }
  .enter .slab { animation: slab 0.4s cubic-bezier(.2,.7,.2,1) 0.12s both, land 0.4s ease 0.32s both; }
  .enter .facts div { animation: rowin 0.35s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 50ms + 0.18s); }
  .enter .row { animation: rowin 0.4s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 28ms); }
  .enter .bar i { animation: grow 0.45s cubic-bezier(.2,.7,.2,1) both; }
  .swap .finding { animation: rowin 0.28s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 18ms); }
  @keyframes maskin { from { transform: translateY(110%); } to { transform: none; } }
  @keyframes slab { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rowin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes land { from { box-shadow: 0 0 0 var(--ink); } to { box-shadow: 6px 6px 0 var(--ink); } }
  @keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes wipe {
    0% { transform: scaleX(0); transform-origin: right center; }
    46% { transform: scaleX(1); transform-origin: right center; }
    54% { transform: scaleX(1); transform-origin: left center; }
    100% { transform: scaleX(0); transform-origin: left center; }
  }
  @keyframes walk { to { transform: translateX(380%); } }
  @keyframes strike { to { transform: scaleX(1); } }
  @keyframes lift { to { opacity: 0; transform: translateY(-8px); } }
  @media (max-width: 800px) {
    .hero, .facts, .pick { grid-template-columns: 1fr; }
    .facts div { border-right: 0; border-bottom: 2px solid var(--ink); padding: 12px 0; }
    .facts div:last-child { border-bottom: 0; }
    .wrap { width: min(1080px, calc(100% - 24px)); }
    .slab { box-shadow: 4px 4px 0 var(--ink); }
  }
  @media (min-width: 960px) {
    .split { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); align-items: start; }
    .findings-col { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="topline" aria-hidden="true"></div>
<div class="wipe" aria-hidden="true"></div>
<div class="wrap" id="app">
  <header class="nav">
    <div>
      <p class="word">contexttax</p>
      <p class="nav-meta">Reading the repo</p>
    </div>
  </header>
  <p class="loading">Scanning CLAUDE.md, AGENTS.md, .cursor/rules/*.mdc, and SKILL.md.</p>
</div>
<noscript><p class="error">contexttax needs JavaScript to draw this report.</p></noscript>
<script>
(function () {
  const KIND_LABEL = {
    duplicate_line: "Duplicated line",
    missing_path: "Missing path",
    missing_script: "Missing script",
    oversized_file: "Oversized file"
  };
  const CHIPS = [
    ["all", "All"],
    ["duplicate_line", "Duplicates"],
    ["missing_path", "Missing paths"],
    ["missing_script", "Scripts"],
    ["oversized_file", "Oversized"]
  ];

  let report = null;
  let kind = "all";
  let agent = "all";
  let limit = 12;
  let inflight = false;
  let arming = false;
  let seenScan = "";
  let seenTokens = null;
  let seq = 0;
  let errorText = "";
  let reveal = false;
  const expanded = new Set();
  const app = document.getElementById("app");
  app.addEventListener("click", onClick);

  function reportURL() {
    const path = window.location.pathname || "/";
    const base = path.endsWith("/") ? path : path.replace(/\/[^/]*$/, "/");
    return base + "api/report";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      switch (c) {
        case "&": return "\u0026amp;";
        case "<": return "\u0026lt;";
        case ">": return "\u0026gt;";
        case '"': return "\u0026quot;";
        default: return "\u0026#39;";
      }
    });
  }

  function fmt(n) {
    return new Intl.NumberFormat("en-US").format(n || 0);
  }

  function when(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" });
  }

  function reduceMotion() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function agentSets() {
    const map = new Map();
    (report.agents || []).forEach(function (a) {
      map.set(a.id, new Set((a.files || []).map(function (f) { return f.path; })));
    });
    return map;
  }

  function touches(f, id, sets) {
    const files = sets.get(id);
    if (!files) return false;
    if (f.file && files.has(f.file)) return true;
    for (const p of f.files || []) if (files.has(p)) return true;
    for (const loc of f.locations || []) if (files.has(loc.file)) return true;
    return false;
  }

  function inAgent(f, sets) {
    return agent === "all" || touches(f, agent, sets);
  }

  async function load() {
    if (inflight) return;
    inflight = true;
    errorText = "";
    document.body.classList.add("scanning");
    render();
    try {
      const res = await fetch(reportURL(), { cache: "no-store" });
      if (!res.ok) {
        let msg = "Report failed (" + res.status + ")";
        try {
          const body = await res.json();
          if (body && body.error) msg = body.error;
        } catch (ignore) {}
        throw new Error(msg);
      }
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      report = data;
      if (agent !== "all" && !(report.agents || []).some(function (a) { return a.id === agent; })) agent = "all";
      document.title = "contexttax · " + fmt(report.totals.tokens) + " tokens";
    } catch (err) {
      errorText = err && err.message ? err.message : "Could not load the report";
    } finally {
      inflight = false;
      document.body.classList.remove("scanning");
      render();
    }
  }

  function onClick(e) {
    const btn = e.target.closest("[data-action]");
    if (!btn || inflight || arming) return;
    const action = btn.dataset.action;
    if (action === "rescan") load();
    if (action === "theme") { flipTheme(); return; }
    if (action === "kind") { kind = btn.dataset.kind; limit = 12; render(); }
    if (action === "agent") {
      agent = agent === btn.dataset.id ? "all" : btn.dataset.id;
      limit = 12;
      render();
    }
    if (action === "more") { limit += 20; render(); }
    if (action === "expand") {
      const key = btn.dataset.key;
      if (expanded.has(key)) expanded.delete(key);
      else expanded.add(key);
      render();
    }
    if (action === "hold" || action === "release") {
      const card = btn.closest(".file-card, .finding");
      const go = function () { arming = false; gate(action, btn.dataset.path); };
      if (card && !reduceMotion()) {
        arming = true;
        card.classList.add(action === "hold" ? "striking" : "restoring");
        window.setTimeout(go, 340);
      } else go();
    }
  }

  function themeBtn() {
    const dark = document.documentElement.dataset.theme === "dark";
    return '<button type="button" class="theme" data-action="theme" aria-pressed="' + dark + '" aria-label="' +
      (dark ? "Use light theme" : "Use dark theme") + '"><i></i><span>Light</span><span>Dark</span></button>';
  }

  function setTheme(next) {
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("contexttax-theme", next); } catch (err) {}
    const meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.content = next;
  }

  function flipTheme() {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    const wipe = document.querySelector(".wipe");
    if (!wipe || wipe.classList.contains("go") || reduceMotion()) {
      setTheme(next);
      render();
      return;
    }
    wipe.classList.add("go");
    window.setTimeout(function () { setTheme(next); render(); }, 300);
    wipe.addEventListener("animationend", function done() {
      wipe.classList.remove("go");
      wipe.removeEventListener("animationend", done);
    });
  }

  async function gate(action, path) {
    if (inflight) return;
    inflight = true;
    errorText = "";
    document.body.classList.add("scanning");
    try {
      const res = await fetch(action === "hold" ? "/api/hold" : "/api/release", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: path })
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data && data.error) || "Could not update that file");
      report = data;
    } catch (err) {
      errorText = err && err.message ? err.message : "Could not update that file";
    } finally {
      inflight = false;
      document.body.classList.remove("scanning");
      render();
    }
  }

  function card(a, maxChars) {
    const over = (a.files || []).some(function (f) { return f.tokens > (report.tokenLimit || 2500); });
    const width = maxChars ? Math.max(4, Math.round((a.chars / maxChars) * 100)) : 0;
    const i = seq++;
    const n = String(i + 1).padStart(2, "0");
    const files = (a.files || []).map(function (f) {
      return '<li class="file-card"><code>' + esc(f.path) + "</code>" +
        '<p class="purpose">' + esc(f.purpose || "No description in the file") + "</p>" +
        '<p class="when">' + esc(f.when || "") + " · " + fmt(f.tokens) + " tokens · " + fmt(f.chars) + " characters</p>" +
        '<button type="button" class="btn yellow small" data-action="hold" data-path="' + esc(f.path) + '">Cut off</button></li>';
    }).join("");
    return (
      '<article class="row' + (agent === a.id ? " picked" : "") + '" style="--i:' + i + '">' +
        '<button type="button" class="pick" data-action="agent" data-id="' + esc(a.id) + '" aria-pressed="' + (agent === a.id) + '">' +
          '<span class="idx">' + n + "</span>" +
          '<span><span class="agent-name">' + esc(a.name) + "</span>" +
          '<div class="meta">' + esc(a.preload === "on-demand" ? "On demand" : "Always on") + (over ? " · Over limit" : "") + "</div>" +
          '<div class="bar' + (over ? " hot" : "") + '"><i style="width:' + width + '%"></i></div></span>' +
          '<span class="tok' + (over ? " hot" : "") + '">' + fmt(a.tokens) + "</span>" +
        "</button>" +
        '<ul class="files">' + files + "</ul>" +
      "</article>"
    );
  }

  function locList(f, key) {
    const locs = f.locations || [];
    const open = expanded.has(key);
    const shown = open ? locs : locs.slice(0, 6);
    const items = shown.map(function (loc) {
      return '<li class="loc"><code>' + esc(loc.file) + "</code> " + esc((loc.lines || []).join(", ")) + "</li>";
    }).join("");
    const extra = !open && locs.length > shown.length
      ? '<button type="button" class="more" data-action="expand" data-key="' + esc(key) + '">+' + (locs.length - shown.length) + " files</button>"
      : "";
    return '<ul class="locs">' + items + "</ul>" + extra;
  }

  function findingView(f, index) {
    const label = KIND_LABEL[f.kind] || f.kind;
    let body = "";
    if (f.kind === "duplicate_line") {
      body = '<p class="quote">' + esc(f.text) + "</p>" + locList(f, "dup:" + index);
    } else if (f.kind === "missing_path") {
      body = '<p class="quote"><code>' + esc(f.path) + "</code></p>" +
        '<p class="where">Referenced from <code>' + esc(f.file) + "</code>" + (f.line ? " line " + f.line : "") + "</p>";
    } else if (f.kind === "missing_script") {
      body = '<p class="quote">npm run <code>' + esc(f.script) + "</code></p>" +
        '<p class="where">' + esc(f.message) + " · <code>" + esc(f.file) + "</code>" + (f.line ? " line " + f.line : "") + "</p>";
    } else if (f.kind === "oversized_file") {
      body = '<p class="quote"><code>' + esc(f.file) + "</code></p>" +
        '<p class="where">' + fmt(f.tokens) + " tokens · limit " + fmt(report.tokenLimit || 2500) + " · " + fmt(f.chars) + " characters</p>";
    } else {
      body = '<p class="where">' + esc(f.message) + "</p>";
    }
    const meta = f.kind === "duplicate_line" ? (f.count || (f.files || []).length) + " files" : "";
    return (
      '<article class="finding" style="--i:' + index + '">' +
        '<div class="finding-top"><span class="k">' + esc(label) + "</span>" +
        (meta ? '<span class="meta">' + esc(meta) + "</span>" : "") + "</div>" +
        body +
      "</article>"
    );
  }

  function render() {
    if (!report) {
      app.innerHTML =
        '<header class="nav"><div><p class="word">contexttax</p><p class="nav-meta">' +
        (inflight ? "Reading the repo" : "Waiting") + "</p></div>" +
        '<div class="nav-actions">' + themeBtn() + "</div></header>" +
        (errorText
          ? '<p class="error">' + esc(errorText) + '</p><p class="hint">Open a terminal in the repository and run contexttax.exe, or pass the folder: contexttax.exe C:\\path\\to\\repo</p><button type="button" class="btn ink" data-action="rescan">Retry</button>'
          : '<p class="loading">Scanning CLAUDE.md, AGENTS.md, .cursor/rules/*.mdc, and SKILL.md.</p>');
      return;
    }

    const sets = agentSets();
    const agents = report.agents || [];
    const findings = report.findings || [];
    const universe = findings.filter(function (f) { return inAgent(f, sets); });
    const shown = universe.filter(function (f) { return kind === "all" || f.kind === kind; });
    const counts = { all: universe.length };
    CHIPS.forEach(function (c) { if (c[0] !== "all") counts[c[0]] = 0; });
    universe.forEach(function (f) { counts[f.kind] = (counts[f.kind] || 0) + 1; });

    const always = agents.filter(function (a) { return a.preload !== "on-demand"; });
    const skills = agents.filter(function (a) { return a.preload === "on-demand"; });
    const oversizedAll = findings.filter(function (f) { return f.kind === "oversized_file"; }).length;
    let maxChars = 1;
    agents.forEach(function (a) { if (a.chars > maxChars) maxChars = a.chars; });
    const t = report.totals || {};
    const scanKey = report.scannedAt || "";
    const enter = scanKey !== seenScan;
    reveal = enter;
    const prevTotal = seenTokens;
    seenScan = scanKey;
    seenTokens = t.tokens || 0;
    seq = 0;
    const ruleFrom = (function () {
      const rule = app.querySelector(".rule");
      if (!rule || !rule.style.width) return null;
      return { width: rule.style.width, transform: rule.style.transform };
    })();

    const tabs = '<i class="rule" aria-hidden="true"></i>' + CHIPS.map(function (c) {
      return '<button type="button" class="tab" data-action="kind" data-kind="' + c[0] + '" aria-pressed="' + (kind === c[0]) + '">' +
        esc(c[1]) + " " + fmt(counts[c[0]] || 0) + "</button>";
    }).join("");

    const list = shown.slice(0, limit).map(findingView).join("");
    const more = shown.length > limit
      ? '<button type="button" class="pager" data-action="more">Show ' + fmt(Math.min(20, shown.length - limit)) + " more</button>"
      : "";
    const empty = agents.length === 0
      ? ((report.held || []).length
        ? '<p class="empty">Every instruction file is cut off.</p>'
        : '<p class="empty">No instruction files. This looks for CLAUDE.md, AGENTS.md, .cursor/rules/*.mdc, and SKILL.md.</p>')
      : (shown.length === 0 ? '<p class="empty">Nothing in this filter.</p>' : list + more);

    function group(title, rows) {
      if (!rows.length) return "";
      return '<p class="group-label">' + esc(title) + "</p>" +
        rows.map(function (a) { return card(a, maxChars); }).join("");
    }

    const heldRows = (report.held || []).map(function (h) {
      return '<article class="finding"><div class="finding-top"><span class="k">Cut off</span><span class="tok">' + fmt(h.tokens) + "</span></div>" +
        '<p class="quote"><code>' + esc(h.path) + "</code></p>" +
        '<p class="purpose">' + esc(h.purpose || "") + "</p>" +
        '<p class="where">' + esc(h.when || "") + " · " + fmt(h.chars) + " characters</p>" +
        '<button type="button" class="btn small" data-action="release" data-path="' + esc(h.path) + '">Allow again</button></article>';
    }).join("");

    app.classList.toggle("enter", enter);
    app.classList.toggle("swap", !enter);
    app.innerHTML =
      '<header class="nav"><div><p class="word">contexttax</p>' +
        '<p class="nav-meta">' + (inflight ? "Reading the repo" : "Local scan") + "</p></div>" +
        '<div class="nav-actions">' + themeBtn() +
        '<button type="button" class="btn ink" data-action="rescan"' + (inflight ? " disabled" : "") + ">" +
        (inflight ? "Scanning" : "Rescan") + "</button></div></header>" +
      (errorText ? '<p class="error">' + esc(errorText) + "</p>" : "") +
      '<section class="hero"><div class="hero-copy">' +
        '<p class="kicker">Preload</p>' +
        '<h1><span><i>What your agents</i></span><span><i>preload.</i></span></h1>' +
        '<p class="lede">A count of CLAUDE.md, AGENTS.md, Cursor rules, and skills. The number is characters divided by 4. It is the cost of loading the file, not one live chat.</p>' +
        '<div class="actions"><button type="button" class="btn" data-action="kind" data-kind="oversized_file">Show oversized</button></div>' +
      "</div>" +
      '<div class="slab"><p class="kicker">Estimated tokens</p><strong class="count">' + (enter ? "0" : fmt(t.tokens)) + "</strong>" +
        '<p class="fine">' + fmt(t.alwaysTokens) + " always on · " + fmt(t.onDemandTokens) + " if every skill loads" +
        ((t.heldTokens || 0) ? " · " + fmt(t.heldTokens) + " cut off" : "") + "</p></div></section>" +
      '<dl class="facts">' +
        fact(t.files, "Files", 0) + fact(t.agents, "Agents", 1) +
        fact(t.findings, "Findings", 2, t.findings > 0) +
        fact(oversizedAll, "Oversized", 3, oversizedAll > 0) +
      "</dl>" +
      '<p class="pathline">' + esc(report.root) + (report.scannedAt ? " · " + esc(when(report.scannedAt)) : "") + "</p>" +
      '<div class="split"><section><h2>The bill</h2>' +
        '<p class="hint">Always-on files are in context before the task. A skill is paid only when it is loaded. Cut off moves the file so agents stop finding it.</p>' +
        group("Always on", always) +
        group("Skills", skills) +
        (agents.length ? "" : '<p class="empty">Nothing to bill.</p>') +
        (heldRows ? '<h2 style="margin-top:22px">Cut off</h2><p class="hint">Parked in .contexttax/held. They stay out until you allow them. Pasting the parked path into a chat can still open the copy.</p>' + heldRows : "") +
      '</section><section class="findings-col"><h2>Findings</h2>' +
        '<p class="hint">Repeated lines, paths that do not exist, npm scripts missing from package.json, and any file over ' + fmt(report.tokenLimit || 2500) + " tokens.</p>" +
        '<div class="tabs" role="toolbar">' + tabs + "</div>" +
        empty +
      "</section></div>" +
      '<footer class="colophon">contexttax</footer>';

    if (enter) {
      tick(app.querySelector(".count"), 0, t.tokens || 0);
      app.querySelectorAll(".n").forEach(function (el, i) {
        window.setTimeout(function () { tick(el, 0, Number(el.dataset.n || 0)); }, 90 + i * 70);
      });
    } else if (prevTotal != null && prevTotal !== (t.tokens || 0)) tick(app.querySelector(".count"), prevTotal, t.tokens || 0);
    placeRule(ruleFrom);
  }

  function fact(n, label, i, warn) {
    const show = reveal ? "0" : fmt(n);
    return '<div style="--i:' + i + '"><dt>' + esc(label) + '</dt><dd class="n' + (warn ? " warn" : "") + '" data-n="' + (n || 0) + '">' + show + "</dd></div>";
  }

  function tick(el, from, to) {
    if (!el) return;
    if (reduceMotion()) { el.textContent = fmt(to); return; }
    const start = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - start) / 520);
      const v = Math.round(from + (to - from) * p);
      el.textContent = fmt(v);
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function placeRule(from) {
    const bar = app.querySelector(".tabs");
    const rule = bar && bar.querySelector(".rule");
    const on = bar && bar.querySelector('[aria-pressed="true"]');
    if (!rule || !on) return;
    const b = bar.getBoundingClientRect();
    const r = on.getBoundingClientRect();
    const next = { width: r.width + "px", transform: "translateX(" + (r.left - b.left) + "px)" };
    if (from && !reduceMotion()) {
      rule.style.transition = "none";
      rule.style.width = from.width;
      rule.style.transform = from.transform;
      requestAnimationFrame(function () {
        rule.style.transition = "transform .28s cubic-bezier(.2,.7,.2,1), width .28s cubic-bezier(.2,.7,.2,1)";
        requestAnimationFrame(function () {
          rule.style.width = next.width;
          rule.style.transform = next.transform;
        });
      });
      return;
    }
    rule.style.width = next.width;
    rule.style.transform = next.transform;
  }

  load();
})();
</script>
</body>
</html>
